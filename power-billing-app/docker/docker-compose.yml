version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: power-billing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: power_billing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  billing-backend:
    image: node:22
    working_dir: /app
    volumes:
      - ../billing-backend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/power_billing
      FRONTEND_ORIGIN: http://localhost:5173
      DEFAULT_UNIT_RATE: 8.25
      DEFAULT_FIXED_CHARGE: 120
      DEFAULT_FRAUD_SPIKE_FACTOR: 2.5
      SEED_DEMO_DATA: "true"
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  frontend-dashboard:
    image: node:22
    working_dir: /app
    volumes:
      - ../frontend-dashboard:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - billing-backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
