name: billing-backend-ci

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: power-billing-app/billing-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: power-billing-app/billing-backend/package-lock.json
      - run: npm install
      - run: npm run check
      - run: npm run build
